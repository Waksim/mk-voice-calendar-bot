name: mk-voice-calendar-bot

services:
  bot:
    image: mk-voice-calendar-bot:${BOT_IMAGE_TAG:-dev}
    build:
      context: ${RELEASE_DIR:-../..}
      dockerfile: deploy/server/Dockerfile
    container_name: mk-voice-calendar-bot
    restart: unless-stopped
    init: true
    depends_on:
      warp:
        condition: service_healthy
        restart: true
      gemini-proxy:
        condition: service_healthy
        restart: true
    user: "1000:1000"
    group_add:
      - "10002"
    environment:
      TELEGRAM_BOT_UPDATE_MODE: webhook
      TELEGRAM_WEBHOOK_LISTEN_HOST: 0.0.0.0
      TELEGRAM_WEBHOOK_LISTEN_PORT: "8080"
      TELEGRAM_WEBHOOK_REGISTER: "false"
      TELEGRAM_WEBHOOK_PATH: /telegram/mk-voice-text-bot/webhook
      TELEGRAM_WEBHOOK_SECRET_FILE: /run/secrets/telegram-webhook-secret
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram-bot-token
      GIGACHAT_CREDENTIALS_FILE: /run/secrets/gigachat-credentials
      GIGACHAT_SCOPE: GIGACHAT_API_CORP
      GIGACHAT_MODEL: GigaChat-2-Max
      GIGACHAT_BASE_URL: https://api.giga.chat/v1
      GIGACHAT_AUTH_URL: https://ngw.devices.sberbank.ru:9443/api/v2/oauth
      GIGACHAT_CA_BUNDLE_FILE: /opt/gigachat-ca/russian_trusted_root_ca_pem.crt
      GIGACHAT_TIMEOUT_SECONDS: "45"
      CODEX_RUNNER_URL: http://127.0.0.1:8091
      CODEX_RUNNER_TOKEN_FILE: /run/secrets/codex-runner-token
      CODEX_MODEL: gpt-5.6-luna
      CODEX_REASONING_EFFORT: high
      CODEX_TIMEOUT_SECONDS: "55"
      CALENDAR_PLANNER_TIMEOUT_SECONDS: "180"
      TELEGRAM_BOT_STATE_PATH: /app/.runtime/state.json
      TELEGRAM_BOT_CONFIRMATION_STATE_PATH: /app/.runtime/calendar-confirmations.json
      TELEGRAM_BOT_OPERATION_STATE_PATH: /app/.runtime/calendar-operations.json
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter-api-key
      # Direct Gemini Developer API is the final planner fallback.
      GEMINI_API_KEY_FILE: /run/secrets/gemini-api-key
      OPENROUTER_VISION_MODEL: google/gemma-4-31b-it:free
      OPENROUTER_VISION_TIMEOUT_SECONDS: "15"
      OPENROUTER_VISION_FALLBACK_MODEL: google/gemma-4-26b-a4b-it:free
      OPENROUTER_VISION_FALLBACK_TIMEOUT_SECONDS: "12"
      GEMINI_VISION_MODEL: gemini-3.7-flash
      GEMINI_VISION_TIMEOUT_SECONDS: "20"
      VISION_LOCAL_OCR_TIMEOUT_SECONDS: "15"
      VISION_MAX_IMAGE_BYTES: "8388608"
      VISION_MAX_IMAGE_PIXELS: "20000000"
      VISION_MAX_DESCRIPTION_CHARS: "4000"
      VISION_MAX_VISIBLE_TEXT_CHARS: "12000"
      VISION_OCR_MODEL_DIR: /opt/rapidocr-models
      TELEGRAM_GATEWAY_LAUNCHER: /app/deploy/server/telegram-gateway
      TELEGRAM_API_ID_FILE: /run/secrets/telegram-api-id
      TELEGRAM_API_HASH_FILE: /run/secrets/telegram-api-hash
      TELEGRAM_SESSION_WORK_FILE: /run/secrets/telegram-session-work
      TELEGRAM_SESSION_PERSONAL_FILE: /run/secrets/telegram-session-personal
      TELEGRAM_PERSONAL_USER_ID_FILE: /run/secrets/telegram-personal-user-id
      TELEGRAM_WORK_USER_ID_FILE: /run/secrets/telegram-work-user-id
      CALENDAR_MCP_WORKING_DIRECTORY: /app/calendar-mcp
      CALENDAR_MCP_BINARY_PATH: /app/calendar-mcp/node_modules/.bin/google-calendar-mcp
      GOOGLE_CALENDAR_OAUTH_CREDENTIALS_PATH: /app/.runtime/google-calendar-oauth.json
      GOOGLE_CALENDAR_TOKEN_PATH: /app/.runtime/google-calendar-tokens.json
      CALENDAR_MCP_PROCESS_PATH: /usr/local/bin:/usr/bin:/bin
      HTTPS_PROXY: http://127.0.0.1:1080
      NO_PROXY: 127.0.0.1,localhost,mk-voice-calendar-bot
      HOME: /tmp
      TZ: Europe/Moscow
    volumes:
      - /srv/mk-voice-calendar-bot/runtime:/app/.runtime
      - /etc/mk-voice-calendar-bot/secrets:/run/secrets:ro
      - /srv/mk-voice-calendar-bot/runtime/telegram-mcp-errors.log:/app/vendor/telegram-mcp/mcp_errors.log
      - /etc/mk-voice-calendar-bot/resolv.conf:/etc/resolv.conf:ro
    network_mode: service:warp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0700,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    stop_grace_period: 30s
    pids_limit: 256
    mem_limit: 1536m
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  codex-runner:
    # Deliberately pinned: ordinary app deploys cannot replace code that can
    # access the password-equivalent ChatGPT session. Updating this digest-like
    # tag requires a separate trusted-Compose review.
    image: mk-voice-calendar-bot:${CODEX_RUNNER_IMAGE_TAG:-cb3b06fb21f99c671c8183db5daa77313357b93c}
    container_name: mk-voice-calendar-bot-codex-runner
    restart: unless-stopped
    init: true
    entrypoint:
      - /opt/venv/bin/tg-calendar-codex-runner
    depends_on:
      warp:
        condition: service_healthy
        restart: true
      gemini-proxy:
        condition: service_healthy
        restart: true
    user: "10001:10001"
    group_add:
      - "10002"
    environment:
      CODEX_BINARY_PATH: /usr/local/bin/codex
      CODEX_HOME: /var/lib/codex
      CODEX_RUNNER_LISTEN_HOST: 127.0.0.1
      CODEX_RUNNER_LISTEN_PORT: "8091"
      CODEX_RUNNER_TIMEOUT_SECONDS: "50"
      CODEX_RUNNER_TOKEN_FILE: /run/secrets/codex-runner-token
      CODEX_MODEL: gpt-5.6-luna
      CODEX_REASONING_EFFORT: high
      HTTPS_PROXY: http://127.0.0.1:1080
      NO_PROXY: 127.0.0.1,localhost
      HOME: /tmp
      TZ: Europe/Moscow
    volumes:
      - /srv/mk-voice-calendar-bot/codex-home:/var/lib/codex
      - /etc/mk-voice-calendar-bot/secrets/codex-runner-token:/run/secrets/codex-runner-token:ro
      - /etc/mk-voice-calendar-bot/resolv.conf:/etc/resolv.conf:ro
    network_mode: service:warp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 10s
    pids_limit: 96
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  webhook-tunnel:
    image: mk-webhook-tunnel:${WEBHOOK_IMAGE_TAG:-dev}
    build:
      context: ${RELEASE_DIR:-../..}/deploy/server/webhook-tunnel
      dockerfile: Dockerfile
    container_name: mk-voice-calendar-bot-webhook-tunnel
    restart: unless-stopped
    init: true
    depends_on:
      bot:
        condition: service_healthy
      warp:
        condition: service_healthy
        restart: true
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram-bot-token
      TELEGRAM_WEBHOOK_SECRET_FILE: /run/secrets/telegram-webhook-secret
      TELEGRAM_WEBHOOK_PATH: /telegram/mk-voice-text-bot/webhook
      ORIGIN_HEALTH_URL: http://127.0.0.1:8080/healthz
      CHECK_INTERVAL_SECONDS: "15"
      RETRY_INTERVAL_SECONDS: "3"
      REQUEST_TIMEOUT_SECONDS: "15"
      READY_FILE: /tmp/webhook-tunnel.ready
      HTTPS_PROXY: http://127.0.0.1:1080
      NO_PROXY: 127.0.0.1,localhost,.trycloudflare.com
      TZ: Europe/Moscow
    volumes:
      - /etc/mk-voice-calendar-bot/secrets/telegram-bot-token:/run/secrets/telegram-bot-token:ro
      - /etc/mk-voice-calendar-bot/secrets/telegram-webhook-secret:/run/secrets/telegram-webhook-secret:ro
      - /etc/mk-voice-calendar-bot/resolv.conf:/etc/resolv.conf:ro
    network_mode: service:warp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=1000,gid=1000,mode=0700,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,time; assert time.time() - os.stat('/tmp/webhook-tunnel.ready').st_mtime < 60"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s
    stop_grace_period: 20s
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  warp:
    image: mk-telegram-warp:${WARP_IMAGE_TAG:-dev}
    build:
      context: ${RELEASE_DIR:-../..}/deploy/server/warp
      dockerfile: Dockerfile
    container_name: mk-voice-calendar-bot-warp
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/mk-voice-calendar-bot/warp/wg0.conf:/etc/wireguard/wg0.conf:ro
    networks:
      ingress:
        aliases:
          - mk-voice-calendar-bot
      egress:
        gw_priority: 1
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,mode=0755,size=16m
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,size=8m
    healthcheck:
      test:
        - CMD-SHELL
        - 'now="$$(date +%s)"; last="$$(wg show wg0 latest-handshakes | awk ''NR == 1 {print $$2}'')"; test "$${last:-0}" -gt 0 && test "$$((now - last))" -lt 120'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s
    stop_grace_period: 15s
    pids_limit: 64
    mem_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  gemini-proxy:
    image: ghcr.io/sagernet/sing-box:v1.13.14@sha256:c8b67944345dc84a226b648a71f854818606eae0813c4e6a452f192ef821b5b8
    container_name: mk-voice-calendar-bot-gemini-proxy
    restart: unless-stopped
    init: true
    command:
      - run
      - -c
      - /etc/sing-box/config.json
    depends_on:
      warp:
        condition: service_healthy
        restart: true
    volumes:
      - /etc/mk-voice-calendar-bot/gemini-proxy/config.json:/etc/sing-box/config.json:ro
      - /etc/mk-voice-calendar-bot/resolv.conf:/etc/resolv.conf:ro
    network_mode: service:warp
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=0700,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z 127.0.0.1 1080
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 15s
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  ingress:
    external: true
    name: zozh-prod_ingress
  egress:
    name: mk-voice-calendar-bot_egress
    driver: bridge
